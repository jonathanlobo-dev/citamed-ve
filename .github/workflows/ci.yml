name: Pruebas

# Corre solo las pruebas que no necesitan base de datos ni red (rápidas y seguras): unitarias del
# backend, unitarias del frontend y que el frontend compile. Los flujos completos contra la base de
# Pruebas (backend/scripts/test-*.js) se corren a mano antes de liberar.
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # package-lock.json no se versiona en este proyecto, por eso npm install y no npm ci
      - name: Instalar dependencias del backend
        working-directory: ./backend
        run: npm install --no-audit --no-fund

      - name: Pruebas unitarias del backend
        working-directory: ./backend
        run: npm run test:unit

      - name: Instalar dependencias del frontend
        working-directory: ./frontend
        run: npm install --no-audit --no-fund

      - name: Pruebas unitarias del frontend
        working-directory: ./frontend
        run: npm run test:unit

      - name: Compilar el frontend
        working-directory: ./frontend
        run: npm run build
